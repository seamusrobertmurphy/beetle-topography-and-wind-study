project:
  type: default
  # Render only the live drafts. Quarto otherwise scans the whole tree, and the archived
  # drafts still carry {{< include _sections/_preamble.qmd >}} directives whose relative
  # paths do not resolve from archive/, which fails the render of every other document
  # with "Include directive failed". They are superseded and must never be rendered.
  render:
    - "01.manuscript/Manuscript.qmd"
    - "01.manuscript/Tables.qmd"
    - "01.manuscript/Supporting Information.qmd"
  # 2026-09-16. The hooks run from _hooks, a copy of _tools restored from git, because the
  # _tools directory entry was corrupted when the drive unmounted mid-session and cannot
  # be read or removed until Disk Utility First Aid runs. After the repair, restore _tools
  # with git checkout, copy the edited format-tables.py and table-format.json from _hooks
  # over it, point these four lines back at _tools and delete _hooks.
  pre-render:
    - "python3 01.manuscript/_hooks/clean-appledouble.py"
    # The shared preamble is included before the Abstract, so a chunk in it that prints
    # appears at the top of every document. That is how the dataset inventory table came
    # to render above the abstract in a submission package on 2026-08-28.
    - "python3 01.manuscript/_hooks/check-preamble-silent.py"
  post-render:
    - "python3 01.manuscript/_hooks/clean-appledouble.py"
    # Table geometry a reference doc cannot carry: 16.5 cm width, 1.1 cm
    # header and 0.6 cm body rows, 8 pt, left justified. Without this every
    # render would need the tables reformatted by hand in Word.
    - "python3 01.manuscript/_hooks/format-tables.py"
    # Fills the four {{WC_*}} placeholders with the rendered document's own
    # counts, so the declared length cannot drift from the manuscript.
    - "python3 01.manuscript/_hooks/stamp-wordcounts.py"
    # Journal of Pest Science asks for double line spacing and consecutive line
    # numbers. Both are section and style properties the reference document does not
    # carry, so they are written into the main document after the render.
    - "python3 01.manuscript/_hooks/format-body.py"